# Leading Publishers Inventory - runs the whole system on one PC.
#   docker compose up -d        start (or apply an update)
#   docker compose down         stop (data is kept)
# Settings come from the .env file next to this one (copy .env.example to .env).
# Only the web app is published (port 80 by default); the API and database are reachable only
# from inside this Docker network.

name: leadingims

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-Asia/Karachi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: leadingims/api:${IMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: inventory
      DB_USERNAME: inventory_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Only used on the very first start, when the database has no users yet.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      BUSINESS_NAME: ${BUSINESS_NAME:-Leading Publishers}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      # Plain HTTP inside the office network, so the session cookie must not be HTTPS-only.
      SESSION_COOKIE_SECURE: "false"
    logging: *logging

  web:
    image: leadingims/web:${IMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:3000"
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${APP_TIMEZONE:-Asia/Karachi}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup.sh", "loop"]
    logging: *logging

volumes:
  db-data:
