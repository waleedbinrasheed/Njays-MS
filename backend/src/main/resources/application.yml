# Database credentials are never committed. Supply them via environment variables
# (DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD) or a git-ignored application-local.yml next to
# where the app is started (see application-local.example.yml).
spring:
  application:
    name: inventory-backend
  config:
    import: "optional:file:./application-local.yml"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}
    username: ${DB_USERNAME:inventory_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # Only the Next.js server talks to the API; keep it off the LAN by default.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      # Fallback only; authenticated sessions use app.security.session-timeout.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: IMS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  # "Today", "this month" and date filters are counted in this zone.
  timezone: ${APP_TIMEZONE:Asia/Karachi}
  # Printed at the top of purchase and sales invoices. Override in application-local.yml.
  business:
    name: ${BUSINESS_NAME:Book Shop}
    address: ${BUSINESS_ADDRESS:}
    phone: ${BUSINESS_PHONE:}
    email: ${BUSINESS_EMAIL:}
  security:
    # Inactivity timeout; the user is signed out after this much idle time.
    session-timeout: ${SESSION_TIMEOUT:30m}
  bootstrap:
    # First administrator, created only when the database has no users.
    # Leave the password blank to have a random temporary one generated and printed to the log once.
    admin-username: admin
    admin-password: ${ADMIN_INITIAL_PASSWORD:}

logging:
  level:
    root: INFO
